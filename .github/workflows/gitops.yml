name: GitOps — Update Kubernetes Manifests

# Triggers after the CI/CD pipeline succeeds on main
on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [main]

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ─────────────────────────────────────────────────────────────────────────────
jobs:
# ─────────────────────────────────────────────────────────────────────────────
  update-manifests:
    name: Update k8s deployment manifest
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write   # push updated manifest back to repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Compute new image tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | head -c7)
          echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "New tag: sha-${SHORT_SHA}"

      - name: Update deployment.yaml
        run: |
          # GHCR image names must be lowercase
          REPO_LOWER=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          NEW_IMAGE="${REGISTRY}/${REPO_LOWER}:${{ steps.tag.outputs.tag }}"

          sed -i "s|image: ghcr.io/.*|image: ${NEW_IMAGE}|g" k8s/deployment.yaml

          echo "Updated deployment to: ${NEW_IMAGE}"
          grep "image:" k8s/deployment.yaml
        env:
          REGISTRY:   ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Commit & push manifest change
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes — skipping commit"
            exit 0
          fi

          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | head -c7)
          git commit -m "chore(gitops): update image to sha-${SHORT_SHA}

          Triggered by: ${{ github.event.workflow_run.html_url }}"

          git push origin main

  # ── Optional: verify ArgoCD/Flux sync status ─────────────────────────────

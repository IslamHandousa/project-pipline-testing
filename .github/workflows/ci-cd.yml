name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags:    ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  REGISTRY:       docker.io
  DOCKERHUB_USER: "01025261808"
  IMAGE_NAME:     "01025261808/myapp"
  DOTNET_VERSION: "9.0.x"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ─────────────────────────────────────────────────────────────────────────────
jobs:
# ─────────────────────────────────────────────────────────────────────────────
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks:   write   # required by dorny/test-reporter to post check runs
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            BASE=$(cat VERSION 2>/dev/null || echo "1.0.0")
            VERSION="${BASE}-${GITHUB_RUN_NUMBER}-$(echo ${GITHUB_SHA} | head -c7)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore MyApp.sln

      - name: Build
        run: dotnet build MyApp.sln --no-restore -c Release

      - name: Test (with coverage)
        run: |
          dotnet test MyApp.sln \
            --no-build -c Release \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./test-results

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: xUnit Results
          path: "**/test-results.trx"
          reporter: dotnet-trx
          fail-on-error: false

# ─────────────────────────────────────────────────────────────────────────────
  docker-build-scan-push:
    name: Docker — Build / Scan / Push
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name != 'pull_request'
    permissions:
      contents:        read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags: latest (main only), semver (on git tag), branch, sha-<short>, build version
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.build-test.outputs.version }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      # ── Build locally first (no push) — needed for Trivy scan ───────────────
      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: myapp:scan
          build-args: VERSION=${{ needs.build-test.outputs.version }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── Trivy — upload SARIF to GitHub Security tab ─────────────────────────
      - name: Trivy scan → SARIF
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myapp:scan
          format:    sarif
          output:    trivy-results.sarif
          severity:  CRITICAL,HIGH
          exit-code: "0"

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      # ── Trivy — fail the pipeline if any CRITICAL CVE found ─────────────────
      - name: Trivy scan → table (fail on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myapp:scan
          format:    table
          severity:  CRITICAL
          exit-code: "1"

      # ── Push all versioned tags to Docker Hub ────────────────────────────────
      - name: Build & push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.build-test.outputs.version }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Print pushed tags
        run: |
          echo "Image pushed to Docker Hub:"
          echo "${{ steps.meta.outputs.tags }}"
